services:
  gateway0:
    image: "ghcr.io/vocdoni/vocdoni-node:${TESTSUITE_BUILD_TAG:-latest}"
    build:
      context: ../../
      args:
        - BUILDARGS

    env_file: "${COMPOSE_HOST_PATH:-.}/env.gateway0"
    ports:
      - "${COMPOSE_DVOTE_PORT_MAPPING:-9090:9090}"
    networks:
      - blockchain
    volumes:
      - data-gateway0:/app/run/

      - gocoverage-gateway0:/app/run/gocoverage
    environment:
      - GOCOVERDIR=/app/run/gocoverage
      - LOG_PANIC_ON_INVALIDCHARS

  test:
    image: "ghcr.io/vocdoni/vocdoni-node-test:${TESTSUITE_BUILD_TAG:-latest}"
    build:
      context: ../../
      target: test
      args:
        - BUILDARGS
    networks:
      - blockchain
    volumes:
      - gocoverage-test:/app/run/gocoverage
    environment:
      - GOCOVERDIR=/app/run/gocoverage
      - LOG_PANIC_ON_INVALIDCHARS
    command: "true"

  gocoverage:
    image: golang:1.23
    volumes:
      - gocoverage-gateway0:/app/run/gocoverage/gateway0
      - gocoverage-test:/app/run/gocoverage/test
    networks:
      - blockchain

  prometheus:
    image: prom/prometheus:v2.26.0
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--log.level=debug"
    networks:
      - blockchain
    profiles:
      - grafana

  grafana:
    image: grafana/grafana
    user: "104"
    depends_on:
      - prometheus
    networks:
      - blockchain
    ports:
      - "[::1]:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./grafana/config.monitoring
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    profiles:
      - grafana


networks:
  blockchain:

volumes:
  data-gateway0: {}
  gocoverage-gateway0: {}
  gocoverage-test: {}
  prometheus_data: {}
  grafana_data: {}

